name: Generate Flutter Android Project

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save existing Flutter files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create . \
            --platforms=android,ios \
            --project-name=tv_remote \
            --org=com.basav.tvremote

      - name: Restore our Flutter files
        run: |
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib lib

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Commit generated Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android pubspec.yaml lib

          git diff --cached --quiet || git commit -m "Generate Flutter Android project"

          git push
